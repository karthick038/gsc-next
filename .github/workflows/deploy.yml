name: Remote SSH Deployment
on:
  push:
    branches:
      - main
      - gsc-next
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          timeout: 60s
          command_timeout: 15m
          debug: true
          script_stop: true
          script: |
            echo "✅ Connected to server"
            echo "🔹 Current user:"
            whoami
            echo "🔹 Current directory:"
            pwd
            echo "🔹 Listing home directory:"
            ls -la
            echo "🔹 Changing to project directory..."
            cd /home/gsc-user/htdocs/gscsite.eduwhistle.com/gsc-next || {
              echo "❌ Failed to cd to project directory"
              exit 1
            }
            echo "🔹 Listing project directory:"
            ls -la
            echo "🔹 Making deploy.sh executable"
            chmod +x deploy.sh || {
              echo "❌ Failed to chmod deploy.sh"
              exit 1
            }
            echo "🚀 Running deploy.sh"
            ./deploy.sh || {
              echo "❌ deploy.sh failed"
              exit 1
            }
            echo "✅ Deployment script finished"