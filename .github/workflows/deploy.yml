name: Remote SSH Deployment

on:
  push:
    branches:
      - main
      - gsc-next
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          debug: true
          script_stop: true
          script: |
            whoami
            pwd
            cd /home/gsc-user/htdocs/gscsite.eduwhistle.com/gsc-next
            ls -la
            chmod +x deploy.sh
            ./deploy.sh
