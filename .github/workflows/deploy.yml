name: Remote SSH Deployment

on:
  push:
    branches:
      - main
      - gsc-next
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          debug: true
          script_stop: true
          script: |
            echo "=============================="
            echo "✅ Connected to server"
            echo "=============================="
            
            echo "🔹 Current user:"
            whoami
            
            echo "🔹 Home directory:"
            echo $HOME
            
            echo "🔹 Current working directory:"
            pwd
            
            echo "🔹 Environment variables:"
            env
            
            echo "🔹 Listing home directory:"
            ls -la $HOME
            
            echo "🔹 Checking .ssh folder and keys:"
            ls -la $HOME/.ssh
            echo "Contents of authorized_keys:"
            cat $HOME/.ssh/authorized_keys
            
            echo "🔹 Changing to project directory..."
            cd /home/gsc-user/htdocs/gscsite.eduwhistle.com/gsc-next || { echo "❌ Failed to cd to project directory"; exit 1; }
            
            echo "🔹 Current project directory:"
            pwd
            ls -la
            
            echo "🔹 User info:"
            id
            
            echo "🔹 Node version:"
            node -v || echo "❌ Node not found"
            
            echo "🔹 NPM version:"
            npm -v || echo "❌ NPM not found"
            
            echo "🔹 Making deploy.sh executable..."
            chmod +x deploy.sh || { echo "❌ Failed to chmod deploy.sh"; exit 1; }
            
            echo "🔹 Running deploy.sh..."
            ./deploy.sh || { echo "❌ deploy.sh failed"; exit 1; }
            
            echo "=============================="
            echo "✅ Deployment finished"
            echo "=============================="