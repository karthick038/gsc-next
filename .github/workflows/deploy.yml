name: Deploy Next.js to Production

on:
  push:
    branches:
      - gsc-next

jobs:
  deploy-production:
    name: Deploy to Hostinger (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/eduwhistle-gscanalytics/htdocs/gscanalytics.eduwhistle.com/gsc-next

            git config --global --add safe.directory "$(pwd)"

            echo "Before pull"
            git log -1 --oneline || true

            git fetch origin
            git checkout gsc-next
            git reset --hard origin/gsc-next

            echo "After pull"
            git log -1 --oneline

            echo "Cleaning old build"
            rm -rf .next

            echo "Installing dependencies"
            npm install

            echo "Building Next.js app"
            npm run build

            echo "Restarting PM2"
            pm2 restart gsc-next || PORT=3021 pm2 start npm --name "gsc-next" -- start

            pm2 save