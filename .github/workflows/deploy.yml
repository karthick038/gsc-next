name: Remote SSH Deployment

on:
  push:
    branches:
      - main
      - gsc-next
  workflow_dispatch: # Allows manual triggering from Actions tab

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Matches current Next.js best practices

      - name: Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true # Fails the workflow if deploy.sh returns non-zero code
          script: |
            cd /home/eduwhistle-gscsite/htdocs/gscsite.eduwhistle.com/gsc-next
            chmod +x deploy.sh
            ./deploy.sh
